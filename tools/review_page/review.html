<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第__ROUND__轮图片复审 · 原图对照</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#17191d;color:#eee;font:15px system-ui,sans-serif}header{padding:14px 22px;background:#242830;position:sticky;top:0;z-index:2}h1{font-size:19px;margin:0 0 9px}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,input{font:inherit;border:1px solid #627084;border-radius:5px;padding:7px 10px;background:#1c2027;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #7ec9ed}button:disabled{opacity:.4}#jump{width:85px}#filter{width:230px}.meta{font-size:13px;color:#b2bfcc;margin-top:8px;overflow-wrap:anywhere}.hint{color:#8cdaff;margin:9px 0 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 22px}.pane{min-width:0;background:#202329;border:1px solid #393e49;border-radius:8px;padding:12px}.pane h2{font-size:14px;margin:0 0 10px;color:#bbc8d4}.imagebox{min-height:85px;display:grid;align-items:center;justify-items:center;background:repeating-conic-gradient(#25272b 0% 25%,#303238 0% 50%) 0 0/20px 20px}.pane img{display:block;max-width:100%;height:auto;max-height:52vh;object-fit:contain}.feedback{margin:0 22px 22px;display:grid;grid-template-columns:1fr 1.6fr;gap:18px}.previous{font-size:14px;color:#ced3da;white-space:pre-wrap;padding:10px;background:#242830;border-radius:6px;max-height:150px;overflow:auto}label{display:block;margin-bottom:7px;font-weight:600}textarea{width:100%;height:112px;font:17px system-ui,sans-serif;resize:vertical;border:1px solid #627084;border-radius:6px;background:#10141b;color:#fff;padding:10px}#saved{font-size:12px;color:#adc4ba;margin-top:6px}#action{font-size:13px;color:#e6c58c}a{color:#9ccaff}.foot{font-size:12px;color:#b2bfcc;margin-top:8px}@media(max-width:800px){.pair,.feedback{grid-template-columns:1fr}.pane img{max-height:40vh}}
</style></head><body data-revision="__REVISION__" data-round="__ROUND__">
<header><h1>第__ROUND__轮图片复审 · 左原图 / 右本轮修订</h1><div class="tools">
<button id="prev">← 上一张</button><button id="next">下一张 →</button><strong id="count"></strong>
<label>编号 <input id="jump" type="number" min="1"></label><button id="go">跳转</button>
<input id="filter" type="search" aria-label="筛选图片" placeholder="图片 ID / 对象 / 资源路径">
<button id="all">全部图片</button><button id="revised">仅看上轮有反馈</button><button id="download">下载本轮反馈 CSV</button>
</div><div id="meta" class="meta"></div><p class="hint">← / → 始终翻页，包括输入框内；翻页后自动聚焦本轮反馈框。原尺寸 PNG 可点击打开。</p></header>
<main><div class="pair"><section class="pane"><h2>原图</h2><div class="imagebox"><a id="origlink" target="_blank" rel="noopener"><img id="orig" alt="原图"></a></div></section>
<section class="pane"><h2>本轮修订 · 原生 BC 编码后解码图</h2><div class="imagebox"><a id="translink" target="_blank" rel="noopener"><img id="trans" alt="本轮修订"></a></div><div class="foot"><span id="action"></span> · <a id="oldlink" target="_blank" rel="noopener">查看上轮版本</a></div><div class="foot" id="quality" style="color:#ffc77d"></div></section></div>
<section class="feedback"><div><label>你的上轮反馈</label><div id="previous" class="previous"></div></div><div><label for="comment">本轮反馈</label><textarea id="comment" placeholder="输入本轮意见，按左右键直接审下一张 / 上一张"></textarea><div id="saved" role="status"></div></div></section></main>
<script type="application/json" id="review-data">__ITEMS__</script><script>__SCRIPT__</script></body></html>
