name: Validate localization infrastructure
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-font.txt
      - name: Install pinned imaging and font test dependencies
        run: python -m pip install -r requirements-font.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - run: python -m compileall -q tools tests
      - run: python tools/series_terms.py fetch
      - run: python tools/series_terms.py check --with-references
      - run: python tools/series_terms.py render --check
